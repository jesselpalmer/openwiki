version: 2
updates:
  - package-ecosystem: npm
    directory: /.github/openwiki
    schedule:
      interval: weekly
    groups:
      openwiki:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
